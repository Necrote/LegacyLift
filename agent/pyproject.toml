[project]
name = "legacylift"
version = "0.1.0"
description = "Agentic AI copilot: legacy Java -> tested Spring Boot microservices"
requires-python = ">=3.10"
dependencies = ["openai>=1.0", "click>=8.1"]

[project.scripts]
legacylift = "legacylift.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
