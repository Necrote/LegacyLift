apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventory-service.name" . }}
  labels:
    {{- include "inventory-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "inventory-service.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
