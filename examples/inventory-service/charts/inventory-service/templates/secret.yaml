{{- if not .Values.existingSecret }}
# Skipped entirely when existingSecret is set, so a real deployment can manage credentials
# outside the chart. stringData is base64-encoded on write by Kubernetes - that is encoding,
# NOT encryption, so this default is demo-grade.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inventory-service.dbName" . }}
  labels:
    {{- include "inventory-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Named for what the postgres image expects; the app maps them onto SPRING_DATASOURCE_*
  # in deployment.yaml, which is Spring's relaxed binding doing the work - the same mechanism
  # compose.yaml uses, which is why application.properties needs no placeholders.
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
