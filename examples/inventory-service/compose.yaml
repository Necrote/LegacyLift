# `docker compose up --build` brings up PostgreSQL and the service together.
# The defaults here match the fallbacks in application.properties, so neither file needs
# editing to run the demo.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory-db:/var/lib/postgresql/data
    # The app runs schema.sql/data.sql and Hibernate's validate pass at startup, all of
    # which need a database that is actually accepting connections - not merely a
    # container that has started. depends_on alone only waits for the latter.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
      # start_period is not optional padding: on a fresh volume initdb runs a TEMPORARY
      # server that pg_isready answers for, so without it the first probe can go green
      # before the real server is listening.
      start_period: 10s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Container-to-container: `db` is the service name on the compose network.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
    depends_on:
      db:
        condition: service_healthy

volumes:
  inventory-db:
