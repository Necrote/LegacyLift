# Demo credentials, deliberately in one place so both workloads read the same values.
# The keys are named for what PostgreSQL's own image expects (POSTGRES_*); the app maps them
# onto SPRING_DATASOURCE_* in 20-app.yaml, which is Spring's relaxed binding doing the work -
# the same mechanism compose.yaml uses, so application.properties needs no placeholders.
#
# stringData (not data) keeps this readable: Kubernetes base64-encodes it on write. That is
# encoding, NOT encryption - a real deployment supplies its own Secret from a sealed source
# rather than committing one.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db
  labels:
    app.kubernetes.io/part-of: inventory-service
type: Opaque
stringData:
  POSTGRES_DB: inventory
  POSTGRES_USER: inventory
  POSTGRES_PASSWORD: inventory
