# Real PostgreSQL datasource. These are plain values, not ${SPRING_DATASOURCE_URL:...}
# placeholders: Spring's relaxed binding already maps the environment variable
# SPRING_DATASOURCE_URL onto spring.datasource.url and gives it higher precedence than this
# file, so a placeholder would only restate what the framework does. That is how compose.yaml
# and any real deployment repoint the service; the values below match compose.yaml's `db`
# service, so `docker compose up` needs no configuration.
# No spring.datasource.driverClassName either - it is derived from the URL.
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory
spring.datasource.username=inventory
spring.datasource.password=inventory

# validate, not create-drop: the schema is owned by schema.sql (and in a real deployment
# would be owned by a migration tool), so Hibernate only checks the entity matches it and
# never silently rewrites a production table.
spring.jpa.hibernate.ddl-auto=validate

# PostgreSQL is not an embedded database, so script initialization is off by default -
# `always` is what runs schema.sql and data.sql. Note there is deliberately NO
# spring.jpa.defer-datasource-initialization here: with ddl-auto=validate the scripts
# must run BEFORE Hibernate validates, and deferring them would fail the check.
spring.sql.init.mode=always
