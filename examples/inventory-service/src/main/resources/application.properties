# Real PostgreSQL datasource. These are plain values, not ${SPRING_DATASOURCE_URL:...}
# placeholders: Spring's relaxed binding already maps the environment variable
# SPRING_DATASOURCE_URL onto spring.datasource.url and gives it higher precedence than this
# file, so a placeholder would only restate what the framework does. That is how compose.yaml
# and any real deployment repoint the service; the values below match compose.yaml's `db`
# service, so `docker compose up` needs no configuration.
# No spring.datasource.driverClassName either - it is derived from the URL.
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory
spring.datasource.username=inventory
spring.datasource.password=inventory

# validate, not create-drop: the schema is owned by schema.sql (and in a real deployment
# would be owned by a migration tool), so Hibernate only checks the entity matches it and
# never silently rewrites a production table.
spring.jpa.hibernate.ddl-auto=validate

# PostgreSQL is not an embedded database, so script initialization is off by default -
# `always` is what runs schema.sql and data.sql. Note there is deliberately NO
# spring.jpa.defer-datasource-initialization here: with ddl-auto=validate the scripts
# must run BEFORE Hibernate validates, and deferring them would fail the check.
spring.sql.init.mode=always

# Splits /actuator/health into the two groups Kubernetes actually distinguishes:
#   /actuator/health/liveness  - is the app wedged? failing it RESTARTS the container
#   /actuator/health/readiness - can it serve right now? failing it only removes the pod from
#                                the Service, so a database outage stops traffic instead of
#                                restart-looping an app that was never broken.
# Boot enables these automatically when it detects Kubernetes; setting it explicitly means the
# same URLs work under `docker compose` and `mvn spring-boot:run` too.
# Only `health` is exposed over HTTP by default - do not widen that; the other endpoints leak
# configuration and env vars.
management.endpoint.health.probes.enabled=true

# Load-bearing, and NOT the default. Out of the box the readiness group contains only
# `readinessState` - the application's own lifecycle flag - so it reports UP with the database
# gone, the pod stays in the Service, and every request answers 500. Verified: scaling
# PostgreSQL to zero left readiness UP until `db` was added here.
management.endpoint.health.group.readiness.include=readinessState,db

# `db` is deliberately absent from liveness. Liveness failure RESTARTS the container, so
# including a dependency there turns a database outage into a restart loop of an application
# that is not broken. Liveness answers "is this process wedged", readiness "can it serve".
management.endpoint.health.group.liveness.include=livenessState
